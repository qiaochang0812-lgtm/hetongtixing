name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source to repo root
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then echo "仓库根目录里没有 zip 文件"; exit 1; fi
          echo "使用 $ZIP"
          rm -rf /tmp/src && mkdir /tmp/src
          unzip -q -o "$ZIP" -d /tmp/src
          rm -rf /tmp/src/__MACOSX
          if [ "$(ls -A /tmp/src | wc -l)" = "1" ] && [ -d "/tmp/src/$(ls /tmp/src)" ]; then
            SRC="/tmp/src/$(ls /tmp/src)"
          else
            SRC=/tmp/src
          fi
          cp -a "$SRC"/. .
          test -f package.json || { echo "解压后根目录没有 package.json"; exit 1; }
          test -f capacitor.config.json || { echo "解压后根目录没有 capacitor.config.json"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply icons, permissions, signing, version
        run: |
          RES=android/app/src/main/res
          cp -r android-res/mipmap-* "$RES"/
          cp android-res/values/ic_launcher_background.xml "$RES/values/ic_launcher_background.xml"
          find "$RES" -name 'splash.png' -exec cp android-res/splash.png {} \;

          MANIFEST=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECORD_AUDIO; do
            if ! grep -q "android.permission.$P" "$MANIFEST"; then
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$MANIFEST"
            fi
          done

          if ! grep -q "android.speech.RecognitionService" "$MANIFEST"; then
            sed -i "s#</manifest>#    <queries><intent><action android:name=\"android.speech.RecognitionService\" /></intent></queries>\n</manifest>#" "$MANIFEST"
          fi

          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("../../qiqi.keystore")
                      storePassword "qiqi-release-2026"
                      keyAlias "qiqi"
                      keyPassword "qiqi-release-2026"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: qiqi-apk
          path: android/app/build/outputs/apk/release/*.apk
